<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Ball Game</title>
  <style>
    body {
      margin: 0;
      background: #1e272e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      background: #000;
      border: 2px solid white;
      display: block;
    }

    .game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px;
      color: white;
      text-align: center;
      display: none;
    }

    .restart {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 20px;
      background: #1e90ff;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="360" height="640"></canvas>
  <div class="game-over" id="gameOverScreen">
    <p>Game Over!</p>
    <p id="scoreDisplay"></p>
    <button class="restart" onclick="restartGame()">Restart</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const paddle = {
      x: canvas.width / 2 - 50,
      y: canvas.height - 20,
      width: 100,
      height: 10,
      color: "white",
      speed: 8,
    };

    const ball = {
      x: Math.random() * canvas.width,
      y: 0,
      radius: 10,
      speed: 3,
      color: "red",
    };

    let score = 0;
    let isGameOver = false;

    // Draw rectangle
    function drawRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }

    // Draw circle
    function drawCircle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
    }

    // Draw text
    function drawText(text, x, y, color) {
      ctx.fillStyle = color;
      ctx.font = "20px Arial";
      ctx.fillText(text, x, y);
    }

    // Update ball position
    function updateBall() {
      ball.y += ball.speed;

      // Check if ball hits the paddle
      if (
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.width &&
        ball.y + ball.radius >= paddle.y
      ) {
        ball.y = 0; // Reset ball position
        ball.x = Math.random() * canvas.width;
        score++; // Increment score
        ball.speed += 0.2; // Increase ball speed
      }

      // Check if ball hits the bottom
      if (ball.y > canvas.height) {
        isGameOver = true;
      }
    }

    // Render game objects
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw paddle
      drawRect(paddle.x, paddle.y, paddle.width, paddle.height, paddle.color);

      // Draw ball
      drawCircle(ball.x, ball.y, ball.radius, ball.color);

      // Draw score
      drawText(`Score: ${score}`, 10, 30, "white");
    }

    // Game loop
    function gameLoop() {
      if (isGameOver) {
        document.getElementById("gameOverScreen").style.display = "block";
        document.getElementById("scoreDisplay").textContent = `Your Score: ${score}`;
        return;
      }

      updateBall();
      render();
      requestAnimationFrame(gameLoop);
    }

    // Handle touch movement
    canvas.addEventListener("touchmove", (event) => {
      const touch = event.touches[0];
      const rect = canvas.getBoundingClientRect();
      const touchX = touch.clientX - rect.left;

      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, touchX - paddle.width / 2));
    });

    // Restart the game
    function restartGame() {
      score = 0;
      ball.x = Math.random() * canvas.width;
      ball.y = 0;
      ball.speed = 3;
      isGameOver = false;
      document.getElementById("gameOverScreen").style.display = "none";
      gameLoop();
    }

    // Start the game
    gameLoop();
  </script>
</body>
</html>
