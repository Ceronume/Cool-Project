<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Solar System</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }

    .solar-system {
      position: relative;
      width: 500px;
      height: 500px;
      perspective: 1000px;
    }

    .sun {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, yellow, orange, red);
      border-radius: 50%;
      box-shadow: 0 0 20px 10px yellow;
    }

    .planet {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, lightblue, blue);
      border-radius: 50%;
      transform-origin: -200px;
      animation: orbit 6s linear infinite;
    }

    .planet:nth-child(2) {
      transform-origin: -150px;
      animation-duration: 4s;
      background: radial-gradient(circle, lightgreen, green);
    }

    .planet:nth-child(3) {
      transform-origin: -250px;
      animation-duration: 8s;
      background: radial-gradient(circle, lightcoral, crimson);
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes orbit {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    footer {
      position: absolute;
      bottom: 20px;
      text-align: center;
      width: 100%;
      font-size: 0.9em;
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="solar-system">
    <div class="sun"></div>
    <div class="orbit"></div>
    <div class="planet"></div>
    <div class="orbit"></div>
    <div class="planet"></div>
    <div class="orbit"></div>
    <div class="planet"></div>
  </div>

  <footer>
    <p>3D Solar System Simulation | By Ceronume</p>
  </footer>

  <script>
    // Orbit customization (add interactive dynamics)
    document.querySelectorAll('.planet').forEach((planet, index) => {
      planet.addEventListener('click', () => {
        alert(`You clicked on planet ${index + 1}`);
      });
    });
  </script>
</body>
</html>
